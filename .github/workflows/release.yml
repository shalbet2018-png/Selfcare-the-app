name: Build demo installers

# Builds both apps, Selfcare (clients) and Selfcare for Business, for Android (.apk) and
# Windows (.exe), and attaches all four to a GitHub Release.
# The web app for iPhone and browsers is published separately by pages.yml.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt', 'Start Selfcare.bat']
  workflow_dispatch:

permissions:
  contents: write

# A new push waits for a running build instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    name: Android (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: client, label: Selfcare, file: Selfcare-Demo.apk }
          - { variant: business, label: Selfcare for Business, file: Selfcare-Business-Demo.apk }
    env:
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Build the APK
        working-directory: android
        # Phones and tablets only (ARM). Signed with Expo's debug key: fine for a demo, not for the Play Store.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - run: cp android/app/build/outputs/apk/release/app-release.apk "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.variant }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: client, label: Selfcare, file: Selfcare-Demo-Setup.exe, built: Selfcare-Demo-Setup-*.exe }
          - { variant: business, label: Selfcare for Business, file: Selfcare-Business-Demo-Setup.exe, built: Selfcare-Business-Demo-Setup-*.exe }
    env:
      APP_VARIANT: ${{ matrix.variant }}
      SELFCARE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: Build the web version into the desktop app
        run: npx expo export --platform web --output-dir desktop/web
        env:
          CI: 1
      - name: Install desktop tools
        working-directory: desktop
        run: npm ci
      - name: Build the installer
        working-directory: desktop
        run: npm run dist
      - name: Check the app opens to the home screen
        working-directory: desktop
        shell: pwsh
        run: |
          $env:SELFCARE_SMOKE = '1'
          $env:SELFCARE_SMOKE_OUT = "$PWD\smoke.txt"
          $exe = Get-ChildItem 'release\win-unpacked\*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru -Wait
          if (Test-Path smoke.txt) { Get-Content smoke.txt }
          if ($p.ExitCode -ne 0) { throw "Desktop app check failed (exit $($p.ExitCode))" }
      - run: Copy-Item "desktop\release\${{ matrix.built }}" "${{ matrix.file }}"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Selfcare demo (build ${{ github.run_number }})
          make_latest: true
          body: |
            Demo builds of both apps, with sample providers. Bookings are saved on the device only.

            | App | Android phones and tablets | Windows laptops and PCs |
            | --- | --- | --- |
            | **Selfcare** (book services) | `Selfcare-Demo.apk` | `Selfcare-Demo-Setup.exe` |
            | **Selfcare for Business** (salons, spas, freelancers) | `Selfcare-Business-Demo.apk` | `Selfcare-Business-Demo-Setup.exe` |

            **Android:** download the APK on the device and open it. Allow installing from your browser or Files app when asked.

            **Windows:** run the setup file. If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (the demo isn't code-signed yet).

            **iPhone and iPad:** open https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ in Safari, tap **Share**, then **Add to Home Screen**.
          files: |
            Selfcare-Demo.apk
            Selfcare-Business-Demo.apk
            Selfcare-Demo-Setup.exe
            Selfcare-Business-Demo-Setup.exe
