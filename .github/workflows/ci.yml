name: Check app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Build Android, iOS and web bundles
        run: npx expo export --platform android --platform ios --platform web
        env:
          CI: 1
          EXPO_OFFLINE: 1
